<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Широкое сердце</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, scale;

        // Настройка размера холста под экран
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Увеличил делитель до 1000, так как сердце стало шире и должно помещаться на экране
            scale = Math.min(width, height) / 1000; 
        }
        window.addEventListener('resize', resize);
        resize();

        let segments = []; // Массив для сохранения нарисованных линий
        let i = 0;         // Текущий угол построения

        // Коэффициент ширины сердца (чем больше число, тем шире сердце)
        const widthStretch = 15.0; 

        function draw() {
            // 1. Очищаем экран
            ctx.clearRect(0, 0, width, height);
            
            // 2. Перемещаем начало координат в центр экрана и инвертируем ось Y
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(scale, -scale); 

            // 3. Рисуем накопленные линии сердца
            ctx.lineWidth = 2;
            for (let seg of segments) {
                ctx.beginPath();
                ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
                ctx.strokeStyle = seg.color;
                ctx.stroke();
            }

            // (Блок с отрисовкой серой линии "радара" удален)

            ctx.restore();

            // 4. Логика анимации
            if (i < 360) {
                addHeartSegment(i); // Добавляем новые линии для текущего угла
                i += 0.5;           // Скорость прорисовки
            }

            requestAnimationFrame(draw);
        }

        // Функция расчета координат сердца
        function addHeartSegment(angleDeg) {
            let a = angleDeg * Math.PI / 180;
            
            // Формула сердца. Умножаем xo на widthStretch, чтобы сделать его шире
            let xo = widthStretch * 16 * Math.pow(Math.sin(a), 3);
            let yo = (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * 16;
            
            // Случайная длина "шерсти" для эффекта пушистости
            let L = Math.random() * 0.35 + 0.15;
            let xi = xo * (1 - L);
            let yi = yo * (1 - L);

            // Рисуем пучок из 10 линий (создаем градиент от красного к темному)
            for (let j = 0; j < 10; j++) {
                let f = j / 10;
                
                // Перевод цветов в формат RGB
                let r = Math.floor((1 - 0.6 * f) * 255);
                let g = Math.floor(0.7 * (1 - f) * 255);
                let b = Math.floor(0.8 * (1 - f) * 255);
                let color = `rgb(${r},${g},${b})`;
                
                // Координаты начала и конца маленькой линии
                let x1 = xo + (xi - xo) * f;
                let y1 = yo + (yi - yo) * f;
                let x2 = xo + (xi - xo) * (f + 0.1);
                let y2 = yo + (yi - yo) * (f + 0.1);

                // Сохраняем линию в массив
                segments.push({ x1, y1, x2, y2, color });
            }
        }

        // Запуск
        requestAnimationFrame(draw);
    </script>
</body>
</html>
